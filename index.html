<!DOCTYPE html>
<html lang="ru">
    <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Roby Agency</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="wrapper">
        <header class="header container">
            <div class="header__info">
                <p class="header__text">A creative agency based in Helsinki.</p>
                <a href="mailto:hello@robi.com" class="header__link">hello@robi.com</a>
            </div>
            <div class="header__logo">
              <img src="pictures/roby-logo.png" alt="Roby Logo">
          </div>
      
          <nav class="header__nav">
              <ul class="nav-list">
                  <li><a href="#" class="nav-link">Home</a></li>
                  <li><a href="#" class="nav-link">About</a></li>
                  <li><a href="#" class="nav-link">News</a></li>
                  <li><a href="#" class="nav-link">Contact</a></li>
                  <li>
                    <a href="#" class="nav-link">
                        Cart(<span>0</span>)
                    </a>
                </li>
              </ul>
          </nav>
      </header>
  
      <main>
        <section class="hero container">
            <div class="hero__image">
                <img src="pictures/man.jpg" alt="Man writing in a notebook">
            </div>

            <div class="hero__content">
              <h1 class="hero__title">
                  “WE BELIEVE THAT<br>
                  <span class="hero__title--light">THE POWER OF DESIGN</span><br>
                  HELPS<br>BUSINESSES.”
              </h1>
              <div class="hero__cta">
                  <a href="#" class="btn-circle">WORK<br>WITH US</a>
              </div>
          </div>
        </section>
      </main>
  
  
  
    </div>
</body>
</html>
